[project]
name = "ha-composite-tracker"
version = "4.3.0.101"
description = "Composite Device Tracker (fork with fallback inputs), test environment only"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component==0.13.375",
  "filetype==1.2.0",  # manifest requirement
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
